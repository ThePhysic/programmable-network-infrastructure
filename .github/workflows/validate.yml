name: Validate network lab
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - run: make test
      - run: sudo bash scripts/bootstrap-linux.sh
      - run: make build
      - run: sudo env PATH="$PATH" python3 scripts/integration.py --output results/ci --duration 1
      - name: Make generated evidence readable to the artifact uploader
        if: always()
        run: if [ -d results ]; then sudo chmod -R a+rX results; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-evidence
          path: results/
          retention-days: 7
