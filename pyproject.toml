[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "programmable-network-infrastructure"
version = "0.1.0"
description = "Reproducible Linux network experiments with a concurrent Go gateway"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
netlab = "netlab.cli:main"

[tool.setuptools]
packages = ["netlab"]
